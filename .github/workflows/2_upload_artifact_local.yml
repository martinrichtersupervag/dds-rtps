name: 2 - Upload Local Test Results to Drive
run-name: ${{ github.actor }} is testing out GitHub Actions 🚀
on: workflow_dispatch
jobs:
  upload_artifact:
    runs-on: self-hosted
    steps:
      - name: Get Artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          name: interoperability_report_complete
          workflow: 1_run_interoperability_tests_local.yml
          workflow_conclusion: completed

      - name: Ensure system dependencies
        run: |
          for cmd in zip gh; do
            which "$cmd" >/dev/null 2>&1 || sudo apt-get install -y "$cmd"
          done

      - name: Create files to upload
        run: |
            rm -rf report_*
            if [ -f timestamp ]; then
              current_date=$(cat timestamp)
            elif ls timestamp*.timestamp 1>/dev/null 2>&1; then
              current_date=$(cat timestamp*.timestamp | head -n 1)
            else
              current_date=$(date '+%Y-%m-%d-%H_%M_%S')
            fi
            echo "$current_date" > timestamp

            [ -f index.html ] && mv index.html interoperability_report.html

            for file in interoperability_report.html junit_interoperability_report.xml interoperability_report.xlsx timestamp; do
              if [ -f "$file" ]; then
                cp "$file" "${file%.*}_$current_date.${file##*.}"
              fi
            done

            zip interoperability_report_$current_date.zip *_$current_date.*
            mkdir -p report_$current_date
            mv interoperability_report_$current_date.zip report_$current_date/
            if [ -f interoperability_report_$current_date.xlsx ]; then
              cp interoperability_report_$current_date.xlsx report_$current_date/
            fi

      - name: Setup Rclone
        uses: AnimMouse/setup-rclone@v1
        with:
          rclone_config: |
            [mygdrive]
            type = drive
            token = ${{ secrets.RCLONE_TOKEN }}
          disable_base64: true

      - name: Upload reports to Google Drive
        run: |
          current_date=$(cat timestamp)
          rclone copy report_$current_date mygdrive:report_$current_date --drive-root-folder-id ${{ secrets.DRIVE_FOLDER_ID }} -v

      - name: Attach detailed report html
        uses: actions/upload-artifact@v4
        with:
          name: detailed_report
          path: |
            ./interoperability_report*.html
