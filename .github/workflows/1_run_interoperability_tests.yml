name: 1 - Run Interoperability Tests
run-name: Run Interoperability Tests (${{ inputs.runner || 'ubuntu-latest' }})
on:
  workflow_dispatch:
    inputs:
      publishers:
        description: 'Publishers to use (JSON array, comma-separated list, or "all")'
        type: string
        default: '["connext_dds","dust_dds","eprosima_fastdds","intercom_dds","opendds","toc_coredx_dds", "hdds", "eclipse_cyclone", "zzdds"]'
      subscribers:
        description: 'Subscribers to use (JSON array, comma-separated list, or "all")'
        type: string
        default: '["connext_dds","dust_dds","eprosima_fastdds","intercom_dds","opendds","toc_coredx_dds", "hdds", "eclipse_cyclone", "zzdds"]'
      runner:
        description: 'Runner environment'
        required: true
        default: 'ubuntu-latest'
        type: choice
        options:
          - ubuntu-latest
          - self-hosted

jobs:
  generate_timestamp:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    outputs:
      publishers: ${{ steps.parse_inputs.outputs.publishers }}
      subscribers: ${{ steps.parse_inputs.outputs.subscribers }}
    steps:
    - name: Generate timestamp and runner_env files
      run: |
        date '+%Y-%m-%d-%H_%M_%S' > timestamp
        echo "${{ inputs.runner || 'ubuntu-latest' }}" > runner_env
    - name: Parse publisher and subscriber inputs
      id: parse_inputs
      run: |
        python3 -c "
        import json, os, ast

        ALL_DDS = ['connext_dds', 'dust_dds', 'eprosima_fastdds', 'intercom_dds', 'opendds', 'toc_coredx_dds', 'hdds', 'eclipse_cyclone', 'zzdds']

        ALIAS_MAP = {
            'connext': 'connext_dds',
            'connextdds': 'connext_dds',
            'rti': 'connext_dds',
            'dust': 'dust_dds',
            'dustdds': 'dust_dds',
            'fastdds': 'eprosima_fastdds',
            'fast_dds': 'eprosima_fastdds',
            'eprosima': 'eprosima_fastdds',
            'intercom': 'intercom_dds',
            'intercomdds': 'intercom_dds',
            'opendds': 'opendds',
            'coredx': 'toc_coredx_dds',
            'toc_coredx': 'toc_coredx_dds',
            'hdds': 'hdds',
            'cyclone': 'eclipse_cyclone',
            'cyclonedds': 'eclipse_cyclone',
            'eclipse_cyclone': 'eclipse_cyclone',
            'zzdds': 'zzdds'
        }

        def resolve_item(x):
            clean = str(x).strip().strip('\'\"[]').lower()
            return ALIAS_MAP.get(clean, clean)

        def parse_input(val):
            val = (val or '').strip()
            if not val or val.lower() == 'all':
                return ALL_DDS
            raw_items = []
            if val.startswith('[') and val.endswith(']'):
                try:
                    res = json.loads(val)
                    if isinstance(res, list) and res:
                        raw_items = res
                except Exception:
                    pass
                if not raw_items:
                    try:
                        res = ast.literal_eval(val)
                        if isinstance(res, (list, tuple, set)) and res:
                            raw_items = list(res)
                    except Exception:
                        pass
            if not raw_items:
                cleaned = val.replace('[', ' ').replace(']', ' ').replace(',', ' ')
                raw_items = [x.strip().strip('\'\"') for x in cleaned.split() if x.strip().strip('\'\"')]
            resolved = [resolve_item(x) for x in raw_items if resolve_item(x)]
            return resolved if resolved else ALL_DDS

        pubs = parse_input('''${{ github.event.inputs.publishers }}''')
        subs = parse_input('''${{ github.event.inputs.subscribers }}''')

        pub_json = json.dumps(pubs)
        sub_json = json.dumps(subs)

        print(f'Parsed publishers: {pub_json}')
        print(f'Parsed subscribers: {sub_json}')

        with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
            f.write(f'publishers={pub_json}\n')
            f.write(f'subscribers={sub_json}\n')
        " || {
          echo 'publishers=["connext_dds","dust_dds","eprosima_fastdds","intercom_dds","opendds","toc_coredx_dds","hdds","eclipse_cyclone","zzdds"]' >> $GITHUB_OUTPUT
          echo 'subscribers=["connext_dds","dust_dds","eprosima_fastdds","intercom_dds","opendds","toc_coredx_dds","hdds","eclipse_cyclone","zzdds"]' >> $GITHUB_OUTPUT
        }
    - name: Upload timestamp file
      uses: actions/upload-artifact@v7
      with:
        name: timestamp
        path: |
          ./timestamp
          ./runner_env

  run_tests:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    needs: generate_timestamp
    strategy:
      fail-fast: false
      matrix:
        publisher: ${{ fromJson(needs.generate_timestamp.outputs.publishers) }}
        subscriber: ${{ fromJson(needs.generate_timestamp.outputs.subscribers) }}

    steps:
    - name: Checkout sources
      uses: actions/checkout@v6
    - uses: actions/setup-python@v6
      if: runner.environment != 'self-hosted'
      with:
        python-version: '3.11.4'
    - name: Download shape_main executables
      uses: robinraju/release-downloader@v1.13
      with:
        repository: "omg-dds/dds-rtps"
        latest: true
        fileName: "*"
        out-file-path: zipped_executables
        preRelease: false
    - name: Unzip executables
      run: unzip 'zipped_executables/*.zip' -d executables
    - name: Install Python requirements
      if: runner.environment != 'self-hosted'
      run: pip install --requirement requirements.txt
    - name: Run Interoperability script
      timeout-minutes: 120
      continue-on-error: true
      run: |
        publisher_exe=executables/${{ matrix.publisher }}*shape_main_linux
        subscriber_exe=executables/${{ matrix.subscriber }}*shape_main_linux
        output_file=junit_report-${{ matrix.publisher }}-${{ matrix.subscriber }}.xml
        extra_args=""
        # Check if publisher executable exists
        if ! ls $publisher_exe 1> /dev/null 2>&1; then
          echo "ERROR: Publisher executable not found: $publisher_exe"
          exit 1
        fi
        # Check if subscriber executable exists
        if ! ls $subscriber_exe 1> /dev/null 2>&1; then
          echo "ERROR: Subscriber executable not found: $subscriber_exe"
          exit 1
        fi
        if [[ "${subscriber_exe,,}" == *opendds* && "${publisher_exe,,}" == *connext_dds* ]]; then
          extra_args="--periodic-announcement 5000"
        fi
        if [ "$RUNNER_ENVIRONMENT" = "self-hosted" ]; then
          echo "Running on self-hosted runner: executing inside isolated Docker container..."
          ./run_in_docker.sh python3 interoperability_report.py --publisher $publisher_exe --subscriber $subscriber_exe --output-name $output_file $extra_args
        else
          echo "Running in GitHub-hosted environment: executing directly..."
          python3 interoperability_report.py --publisher $publisher_exe --subscriber $subscriber_exe --output-name $output_file $extra_args
        fi
    - name: Ensure test report exists
      if: always()
      run: |
        output_file="junit_report-${{ matrix.publisher }}-${{ matrix.subscriber }}.xml"
        if [ ! -f "$output_file" ]; then
          echo "Warning: $output_file was not created. Generating fallback failure report..."
          python3 -c "
          import junitparser
          suite = junitparser.TestSuite('${{ matrix.publisher }}---${{ matrix.subscriber }}')
          case = junitparser.TestCase('Test_Execution_1')
          case.result = [junitparser.Failure('Test execution failed or executable was not found')]
          suite.add_testcase(case)
          xml = junitparser.JUnitXml()
          xml.add_testsuite(suite)
          xml.write('$output_file')
          "
        fi
    - name: Download timestamp
      uses: actions/download-artifact@v8
      with:
        name: timestamp
    - name: Upload report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: junit_report-${{ matrix.publisher }}-${{ matrix.subscriber }}
        path: |
          ./junit_report-${{ matrix.publisher }}-${{ matrix.subscriber }}.xml
          ./timestamp
          ./runner_env

  generate_report:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    needs: run_tests
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: junit_report-*
          merge-multiple: true
      - uses: actions/setup-python@v6
        if: runner.environment != 'self-hosted'
        with:
          python-version: '3.11.4'
      - name: Install Python requirements
        if: runner.environment != 'self-hosted'
        run: pip install --requirement requirements.txt
      - name: Generate report files
        run: |
          RUNNER_VAL="${{ inputs.runner || 'ubuntu-latest' }}"
          if [ "$RUNNER_ENVIRONMENT" = "self-hosted" ]; then
            ./run_in_docker.sh ./generate_reports.sh "$RUNNER_VAL"
          else
            ./generate_reports.sh "$RUNNER_VAL"
          fi
      - name: Download timestamp
        uses: actions/download-artifact@v8
        with:
          name: timestamp
      - name: Publish Summary to GitHub Actions
        if: always()
        run: |
          echo "## 📊 Interoperability Tests Run Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Hosted Machine / Runner** | \`${{ inputs.runner || 'ubuntu-latest' }}\` |" >> $GITHUB_STEP_SUMMARY
          if [ -f timestamp ]; then
            echo "| **Timestamp** | \`$(cat timestamp | tr -d '\r\n')\` |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "| **Triggered By** | @${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Workflow** | ${{ github.workflow }} |" >> $GITHUB_STEP_SUMMARY
      - name: Attach the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: interoperability_report_complete
          path: |
            ./index.html
            ./junit_interoperability_report.xml
            ./interoperability_report.xlsx
            ./timestamp
            ./runner_env
